allowBuilds:
  '@tailwindcss/oxide': true
  '@vercel/speed-insights': true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
  - zod@4.6.1
  - '@types/react@19.3.0'
  - '@types/react-dom@19.3.0'
overrides:
  # esbuild-kit (pulled in by drizzle-kit/better-auth) still pins a vulnerable esbuild
  esbuild: ^0.28.2
