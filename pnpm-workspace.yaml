allowBuilds:
  '@tailwindcss/oxide': true
  '@vercel/speed-insights': true
  core-js-pure: true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
overrides:
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  # security fixes for transitive deps pulled in by storybook/eslint/drizzle-kit devtooling
  'brace-expansion@1': ^1.1.18
  'brace-expansion@5': ^5.0.9
  'js-yaml@3': ^3.15.2
  'js-yaml@4': ^4.3.2
  fast-uri: ^3.1.6
  qs: ^6.16.0
  postcss: ^8.5.23
  esbuild: ^0.25.0
  baseline-browser-mapping: ^2.11.0
  'nanoid@3': ^3.3.18
  browserslist: ^4.28.7
